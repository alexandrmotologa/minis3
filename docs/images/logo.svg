<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="squircle-clip">
      <rect x="24" y="24" width="976" height="976" rx="220" />
    </clipPath>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="cyan-bright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="slate-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>

    <linearGradient id="facet-highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <linearGradient id="facet-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="facet-mid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="facet-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Luxury White Squircle Container -->
  <rect x="24" y="24" width="976" height="976" rx="220" fill="#ffffff" stroke="#e2e8f0" stroke-width="6" />

  <g clip-path="url(#squircle-clip)">
    <g transform="translate(512, 512)" filter="url(#subtle-shadow)">

      <!-- Hexagonal Architectural Gateway Frame (Massive 40px Outer Stroke) -->
      <polygon points="
        0,-390
        338,-195
        338,195
        0,390
        -338,195
        -338,-195
      " fill="none" stroke="#0f172a" stroke-width="40" stroke-linejoin="round" />

      <!-- Inner Dashed Cyan Hexagon (Telemetry Accent) -->
      <polygon points="
        0,-355
        307,-177
        307,177
        0,355
        -307,177
        -307,-177
      " fill="none" stroke="#00f5ff" stroke-width="4" opacity="0.4" stroke-dasharray="16, 12" />

      <!-- ==================== The Anatomical Vault Bear (Ursus CAS) ==================== -->
      
      <!-- Outer Solid Silhouette -->
      <path d="
        M 0,-190
        L 65,-185
        L 115,-260
        L 155,-280
        L 185,-250
        L 190,-165
        L 240,-80
        L 280,60
        L 290,195
        L 210,230
        L 220,300
        L 110,325
        L 0,350
        L -110,325
        L -220,300
        L -210,230
        L -290,195
        L -280,60
        L -240,-80
        L -190,-165
        L -185,-250
        L -155,-280
        L -115,-260
        L -65,-185
        Z
      " fill="url(#slate-body)" stroke="#0f172a" stroke-width="8" stroke-linejoin="round" />

      <!-- Authentic Anatomical Bear Ears (Curved Low-Poly Cups) -->
      <!-- Left Ear (Shadow Side) -->
      <polygon points="-115,-260 -155,-280 -185,-250 -155,-190 -115,-185" fill="url(#facet-dark)" stroke="#0f172a" stroke-width="3" />
      <polygon points="-125,-245 -165,-255 -170,-230 -140,-200" fill="url(#cyan-glow)" />

      <!-- Right Ear (Light Side) -->
      <polygon points="115,-260 155,-280 185,-250 155,-190 115,-185" fill="url(#facet-mid)" stroke="#0f172a" stroke-width="3" />
      <polygon points="125,-245 165,-255 170,-230 140,-200" fill="url(#cyan-glow)" />

      <!-- Broad Ursine Cranium / Forehead -->
      <polygon points="0,-190 65,-105 0,-35 -65,-105" fill="url(#facet-highlight)" stroke="#0f172a" stroke-width="3" />
      <polygon points="0,-190 0,-35 -65,-105" fill="url(#facet-light)" />

      <!-- Temples -->
      <polygon points="-65,-105 -140,-65 -90,-15 -40,-30" fill="url(#facet-dark)" stroke="#0f172a" stroke-width="3" />
      <polygon points="65,-105 140,-65 90,-15 40,-30" fill="url(#facet-mid)" stroke="#0f172a" stroke-width="3" />

      <!-- Piercing Diamond-Cut Cyan Eyes -->
      <!-- Left Eye -->
      <polygon points="-65,-65 -85,-45 -50,-45" fill="url(#cyan-glow)" stroke="#0f172a" stroke-width="2" />
      <circle cx="-65" cy="-51" r="3.5" fill="#ffffff" />

      <!-- Right Eye -->
      <polygon points="65,-65 85,-45 50,-45" fill="url(#cyan-glow)" stroke="#0f172a" stroke-width="2" />
      <circle cx="65" cy="-51" r="3.5" fill="#ffffff" />

      <!-- Muzzle / Nose Bridge -->
      <polygon points="0,-35 45,-25 50,75 0,105" fill="url(#facet-light)" stroke="#0f172a" stroke-width="3" />
      <polygon points="0,-35 -45,-25 -50,75 0,105" fill="url(#facet-mid)" stroke="#0f172a" stroke-width="3" />

      <!-- Cheeks / Jowls -->
      <polygon points="-45,-25 -50,75 -95,50 -90,-15" fill="url(#facet-dark)" stroke="#0f172a" stroke-width="3" />
      <polygon points="45,-25 50,75 95,50 90,-15" fill="url(#facet-mid)" stroke="#0f172a" stroke-width="3" />

      <!-- Nose / Olfactory Sensor (Cyan) -->
      <polygon points="0,55 30,68 0,92 -30,68" fill="url(#cyan-glow)" stroke="#0f172a" stroke-width="1.5" />

      <!-- Chin Shadow / Separation Line -->
      <polygon points="0,105 25,115 -25,115" fill="#0b0f19" />

      <!-- Heavy Armored Shoulder Plates (Tech Facets) -->
      <!-- Left Shoulder -->
      <polygon points="-190,-165 -240,-80 -170,0 -140,-65" fill="url(#facet-dark)" stroke="#0f172a" stroke-width="3" />
      <polygon points="-240,-80 -280,60 -210,120 -170,0" fill="url(#facet-mid)" stroke="#0f172a" stroke-width="3" />
      <polygon points="-280,60 -290,195 -210,230 -210,120" fill="url(#facet-dark)" stroke="#0f172a" stroke-width="3" />
      <polygon points="-270,75 -280,180 -225,190" fill="url(#cyan-glow)" opacity="0.85" />

      <!-- Right Shoulder -->
      <polygon points="190,-165 240,-80 170,0 140,-65" fill="url(#facet-mid)" stroke="#0f172a" stroke-width="3" />
      <polygon points="240,-80 280,60 210,120 170,0" fill="url(#facet-light)" stroke="#0f172a" stroke-width="3" />
      <polygon points="280,60 290,195 210,230 210,120" fill="url(#facet-mid)" stroke="#0f172a" stroke-width="3" />
      <polygon points="270,75 280,180 225,190" fill="url(#cyan-glow)" opacity="0.85" />

      <!-- Massive Armored Chest Plate -->
      <polygon points="0,115 70,125 135,170 0,250" fill="url(#facet-light)" stroke="#0f172a" stroke-width="3" />
      <polygon points="0,115 -70,125 -135,170 0,250" fill="url(#facet-mid)" stroke="#0f172a" stroke-width="3" />

      <!-- Central Hexagonal CAS Cryptographic Core -->
      <polygon points="
        0,145
        42,170
        42,215
        0,240
        -42,215
        -42,170
      " fill="url(#cyan-glow)" stroke="#ffffff" stroke-width="4" />
      <!-- Inner CAS Vault Core -->
      <circle cx="0" cy="192" r="10" fill="#0f172a" />
      <circle cx="0" cy="192" r="5" fill="#ffffff" />

      <!-- Lower Plate Armor -->
      <polygon points="0,250 -135,170 -210,230 -110,325 0,350" fill="url(#facet-dark)" stroke="#0f172a" stroke-width="4" />
      <polygon points="0,250 135,170 210,230 110,325 0,350" fill="url(#facet-mid)" stroke="#0f172a" stroke-width="4" />

      <!-- Chest Cyan Accent Insets -->
      <polygon points="-120,185 -180,230 -110,280" fill="url(#cyan-glow)" opacity="0.8" />
      <polygon points="120,185 180,230 110,280" fill="url(#cyan-glow)" opacity="0.8" />

    </g>
  </g>
</svg>