services:
  minis3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minis3-engine
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - MINIS3_STORAGE_ROOT_DIR=/data/minis3
      - MINIS3_STORAGE_CHUNK_SIZE_BYTES=4194304
      - MINIS3_STORAGE_ZSTD_COMPRESSION_LEVEL=3
      - MINIS3_AUTH_ACCESS_KEY=minis3admin
      - MINIS3_AUTH_SECRET_KEY=minis3secret
      - MINIS3_AUTH_ALLOW_ANONYMOUS=true
    volumes:
      - minis3-data:/data/minis3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/admin/stats"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  minis3-data:
    driver: local
